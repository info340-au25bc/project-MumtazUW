<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luna Dashboard | Sign Up</title>
  <link href="https://fonts.googleapis.com/css?family=Poppins:400,600,700" rel="stylesheet" />
  <link rel="stylesheet" href="css/signupPage.css" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-box">
      <h1>Welcome to Luna</h1>
      <p>Create your account to start organizing your projects.</p>

      <form>
        <input type="text" name="name" placeholder="Full Name" required />
        <input type="email" name="email" placeholder="Email" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit"><a href="projOverview.html">Sign Up</a></button>
      </form>

      <p class="auth-footer">
        Already have an account? <a href="projOverview.html">Sign In</a>
      </p>
    </div>
  </div>
  <footer>© 2025 Luna Health Product Dashboard | INFO 340 Project</footer>
</body>
</html>
