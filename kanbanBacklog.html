<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Angel Hill" />
  <title>Kanban Board: Backlog</title>
  <link href="https://fonts.googleapis.com/css?family=Lato:400,700" rel="stylesheet" />
  <link rel="stylesheet" href="css/kanbanBacklog.css" />
</head>
<body>
  <main>
    <h1>Product Backlog</h1>
<!--added this to allow for page switching, will fix header position soon-->
  <header class="header">
      <nav class="nav">
        <a href="kanbanBacklog.html" class="active">Backlog</a>
        <a href="roadmap.html">Roadmap</a>
        <a href="notification.html">Notification</a>
      </nav>
    </header>
    <form id="backlogForm">
      <input type="text" id="feature" placeholder="Feature name" required />
      <input type="text" id="owner" placeholder="Owner" required />
      <input type="text" id="description" placeholder="Description" required />
      <select id="status" required>
        <option value="">Status</option>
        <option>Planned</option>
        <option>In Progress</option>
        <option>Completed</option>
      </select>
      <select id="priority" required>
        <option value="">Priority</option>
        <option>Critical (P0)</option>
        <option>High (P1)</option>
        <option>Functional (P2)</option>
        <option>Enhancement (P3)</option>
      </select>
      <input type="date" id="dueDate" required />
      <button type="submit">Add Item</button>
    </form>
    <div class="kanban-container">
<!-- Kanban Structured Cols-->
    <div class="kanban-columns">
      <!--Planned Column -->
      <div class="column">
        <h2>Planned</h2>
        <div class="card-container" id="plannedContainer">
          <div class="card">
            <p class="card-content">Planned Item Tester</p>
            <button class="edit-button">Edit</button>
            <button class="delete-button">Delete</button>
          </div>
        </div>
        <div class="card-container" id="plannedContainer">
          <div class="card">
            <p class="card-content">Planned Item Tester 2</p>
            <button class="edit-button">Edit</button>
            <button class="delete-button">Delete</button>
          </div>
        </div>
      </div>
      <!--In Progress Column -->
      <div class="column">
        <h2>In Progress</h2>
        <div class="card-container" id="progressContainer">
          <div class="card">
            <p class="card-content">IP Item Tester</p>
            <button class="edit-button">Edit</button>
            <button class="delete-button">Delete</button>
          </div>
        </div>
      </div>
      <!--Completed Column -->
      <div class="column">
        <h2>Completed</h2>
        <div class="card-container" id="completedContainer">
          <div class="card">
            <p class="card-content">Complete Item Tester</p>
            <button class="edit-button">Edit</button>
            <button class="delete-button">Delete</button>
          </div>
        </div>
      </div>
    </div>
    </div>
  </main>
</body>
</html>
